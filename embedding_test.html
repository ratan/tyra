<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyra Widget Test</title>

    <!--
      IMPORTANT: This test file is designed to be served by a simple local web server,
      NOT opened directly as a file (file://...).

      HOW TO RUN:
      1. In one terminal, run your Flask app: `python3 app.py` (for local testing) OR confirm it's deployed.
      2. In a SECOND terminal, from this project directory, run: `python3 -m http.server 8000`
      3. Open your browser and go to: http://localhost:8000/embedding_test.html
    -->

    <!-- The Chart.js library can still be loaded from a CDN as it is not part of our app -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 20px; text-align: center; }
        h1 { color: #333; }
        p { color: #666; max-width: 600px; }
    </style>
</head>
<body>

    <h1>Tyra Widget Embedding Test Page</h1>
    <p>This page demonstrates how to load and display the Tyra widget from a remote server. The widget launcher icon should appear in the bottom-right corner.</p>

    <!-- This is the target container where the widget's HTML will be injected. -->
    <div id="tyra-chat-widget"></div>

    <script>
        // --- Configuration Variable for Base URL ---
        // Change this single variable to switch between local development and production.
        
        // For local development, use:
        const TYRA_API_BASE_URL = 'http://127.0.0.1:5000'; 
        
        // For production on Render.com, use:
        //const TYRA_API_BASE_URL = 'https://tyra-ai.onrender.com';

        (function() {
            // --- DYNAMIC LOADER SCRIPT ---
            // This function creates and injects the necessary CSS and JS files into the page head.

            // 1. Create the <link> tag for the widget's CSS
            const cssLink = document.createElement('link');
            cssLink.rel = 'stylesheet';
            cssLink.href = `${TYRA_API_BASE_URL}/static/css/tyra_widget.css`;
            document.head.appendChild(cssLink);

            // 2. Create the <script> tag for the widget's JavaScript
            const widgetScript = document.createElement('script');
            widgetScript.src = `${TYRA_API_BASE_URL}/static/js/tyra_widget.js`;
            
            // 3. IMPORTANT: Initialize the widget only AFTER its script has fully loaded
            widgetScript.onload = function() {
                TyraWidget.init({
                    targetElementId: 'tyra-chat-widget',
                    apiUrl: TYRA_API_BASE_URL
                });
            };
            
            // 4. Append the script to the body to start the loading process
            document.body.appendChild(widgetScript);
        })();
    </script>

</body>
</html>
