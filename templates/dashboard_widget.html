<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Tyra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #8B4A9C 0%, #A855A8 100%);
            --background-color: #fcfaff;
            --text-color: #333;
            --light-text-color: #666;
            --card-bg: #fff;
            --card-shadow: 0 8px 30px rgba(139, 74, 156, 0.1);
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .dashboard-container { max-width: 800px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        header h1 {
            background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 2.5em; margin: 0;
        }
        header .header-controls { display: flex; align-items: center; gap: 20px; }
        header a { color: #8B4A9C; text-decoration: none; font-weight: 500; }
        .widget-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .widget { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: var(--card-shadow); transition: opacity 0.3s, transform 0.3s; }
        .widget.hidden { display: none; }
        .widget h2 { margin-top: 0; font-size: 1.2em; border-bottom: 2px solid #f3eef7; padding-bottom: 10px; margin-bottom: 15px; }
        .widget ul { list-style: none; padding: 0; margin: 0; }
        .widget li {
            padding: 8px 0; border-bottom: 1px solid #f8f5fa; font-size: 0.9em; color: var(--light-text-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .widget li:last-child { border-bottom: none; }
        .widget li strong { color: var(--text-color); }
        .meds-item .meds-details {
            display: block; font-size: 0.9em; color: var(--light-text-color);
        }
        .goals-item { padding: 10px 5px; font-size: 1em; color: var(--text-color); }
        .cycle-stats p { margin: 5px 0; font-size: 1.1em; }
        .cycle-stats .stat-value { font-weight: 700; font-size: 1.5em; color: #8B4A9C; }
        .chart-widget { height: 250px; }
        .done-btn { background: none; border: none; color: #a0a0a0; font-size: 1.5em; cursor: pointer; padding: 0 5px; line-height: 1; transition: color 0.2s; }
        .done-btn:hover { color: #4CAF50; }
        .export-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .export-btn, .customize-btn, #save-prefs-btn, #share-report-btn, #copy-link-btn {
            background-image: var(--primary-gradient); color: white; font-weight: bold; border: none;
            cursor: pointer; padding: 10px 15px; border-radius: 8px; transition: transform 0.2s;
        }
        #share-report-btn { background: #6c5ce7; }
        .export-btn:hover, .customize-btn:hover, #save-prefs-btn:hover, #share-report-btn:hover, #copy-link-btn:hover { transform: translateY(-1px); }
        .customize-btn { padding: 8px 12px; font-size: 0.9em; }

        /* Modal Styles */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            overflow: auto; background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: #fefefe; margin: 15% auto; padding: 20px; border: 1px solid #888;
            width: 80%; max-width: 500px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-header h2 { margin: 0; font-size: 1.4em; }
        .close-btn { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close-btn:hover, .close-btn:focus { color: black; text-decoration: none; }
        .prefs-list { list-style: none; padding: 0; }
        .prefs-list li { padding: 10px 5px; }
        .prefs-list label { font-size: 1.1em; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .prefs-list input[type="checkbox"] { width: 20px; height: 20px; }
        #share-link-container { margin-top: 15px; display: flex; gap: 10px; }
        #share-link { flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1 id="dashboard-title"></h1>
            <div class="header-controls">
                <button id="customize-dashboard-btn" class="customize-btn"></button>
                <a href="widget.html" id="back-to-chat-link"></a>
            </div>
        </header>

        <div class="widget-grid">
            <div class="widget cycle-stats" id="cycle-widget">
                <h2 id="widget-title-cycle"></h2>
                <div id="cycle-widget-content"></div>
            </div>
            
            <div class="widget" id="reminders-widget">
                <h2 id="widget-title-reminders"></h2>
                <ul id="reminders-list"></ul>
            </div>

            <div class="widget" id="meds-widget">
                <h2 id="widget-title-meds"></h2>
                <ul id="meds-list"></ul>
            </div>

            <div class="widget" id="goals-widget">
                <h2 id="widget-title-goals"></h2>
                <ul id="goals-list"></ul>
            </div>

            <div class="widget chart-widget" id="cycle-chart-widget">
                <h2 id="widget-title-cycle-history"></h2>
                <canvas id="cycleLengthChart"></canvas>
                <p id="cycleChartStatus" style="text-align:center; display:none;"></p>
            </div>
            <div class="widget chart-widget" id="interaction-chart-widget">
                <h2 id="widget-title-interaction"></h2>
                <canvas id="interactionTimeChart"></canvas>
                <p id="interactionChartStatus" style="text-align:center; display:none;"></p>
            </div>

            <div class="widget" id="logs-widget">
                <h2 id="widget-title-health-logs"></h2>
                <ul id="logs-list"></ul>
            </div>
            
            <div class="widget" id="export-widget">
                <h2 id="widget-title-export"></h2>
                <p id="export-description"></p>
                <div class="export-buttons">
                    <form action="http://127.0.0.1:5000/export" method="post" style="display: inline;">
                        <input type="hidden" name="format" value="pdf">
                        <button type="submit" class="export-btn" id="export-pdf-button"></button>
                    </form>
                    <form action="http://127.0.0.1:5000/export" method="post" style="display: inline;">
                        <input type="hidden" name="format" value="csv">
                        <button type="submit" class="export-btn" id="export-csv-button"></button>
                    </form>
                    <button id="share-report-btn" class="export-btn" style="background: #6c5ce7;"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="prefs-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="customize-modal-title"></h2>
                <span class="close-btn" id="close-prefs-modal">&times;</span>
            </div>
            <ul class="prefs-list" id="prefs-list"></ul>
            <button id="save-prefs-btn"></button>
        </div>
    </div>

    <div id="share-modal" class="modal">
         <div class="modal-content">
            <div class="modal-header">
                <h2 id="share-modal-title"></h2>
                <span class="close-btn" id="close-share-modal">&times;</span>
            </div>
            <p id="share-modal-description"></p>
            <div id="share-link-container">
                <input type="text" id="share-link" readonly>
                <button id="copy-link-btn" class="export-btn"></button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- GLOBAL STATE ---
            let LANG_STRINGS = {};
            let FEATURE_FLAGS = {};
            const API_BASE_URL = ""; // Use relative paths

            // --- API HELPERS ---
            async function handleApiRequest(endpoint, options = {}) {
                options.credentials = 'include';
                const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ error: 'An unknown API error occurred.' }));
                    throw new Error(errorData.message || errorData.error);
                }
                return response.json();
            }

            // --- RENDER FUNCTIONS ---
            function renderStaticText() {
                const ls = LANG_STRINGS.lang_data;
                document.title = ls.dashboard_title.replace('{name}', '...');
                document.getElementById('customize-dashboard-btn').textContent = ls.dashboard_customize_link;
                document.getElementById('back-to-chat-link').textContent = ls.back_to_chat_link;
                document.getElementById('widget-title-cycle').textContent = ls.widget_title_cycle;
                document.getElementById('widget-title-reminders').textContent = ls.widget_title_reminders;
                document.getElementById('widget-title-cycle-history').textContent = ls.widget_title_cycle_history;
                document.getElementById('interactionChartStatus').textContent = ls.no_chart_data_text;
                document.getElementById('cycleChartStatus').textContent = ls.no_chart_data_text;
                document.getElementById('widget-title-interaction').textContent = ls.widget_title_interaction;
                document.getElementById('widget-title-health-logs').textContent = ls.widget_title_health_logs;
                document.getElementById('widget-title-meds').textContent = ls.widget_title_meds;
                document.getElementById('widget-title-goals').textContent = ls.widget_title_goals;
                document.getElementById('widget-title-export').textContent = ls.widget_title_export;
                document.getElementById('export-description').textContent = ls.export_description;
                document.getElementById('export-pdf-button').textContent = ls.export_pdf_button;
                document.getElementById('export-csv-button').textContent = ls.export_csv_button;
                document.getElementById('share-report-btn').textContent = ls.share_report_button;
                document.getElementById('customize-modal-title').textContent = ls.customize_modal_title;
                document.getElementById('save-prefs-btn').textContent = ls.customize_modal_save_button;
                document.getElementById('share-modal-title').textContent = ls.share_modal_title;
                document.getElementById('share-modal-description').textContent = ls.share_modal_description;
                document.getElementById('copy-link-btn').textContent = ls.copy_button;
            }

            function renderDashboard(data) {
                const ls = LANG_STRINGS.lang_data;
                document.getElementById('dashboard-title').innerHTML = ls.dashboard_title.replace('{name}', data.name);
                
                const cycleContent = document.getElementById('cycle-widget-content');
                if (data.cycle_stats.current_day) {
                    cycleContent.innerHTML = `<p>You are on <span class="stat-value">Day ${data.cycle_stats.current_day}</span></p>`;
                } else if (data.cycle_stats.predicted_next) {
                    cycleContent.innerHTML = `<p>No active cycle logged.</p>`;
                } else {
                    cycleContent.innerHTML = `<p>Log your first period to see cycle stats.</p>`;
                }
                if (data.cycle_stats.predicted_next) cycleContent.innerHTML += `<p>Predicted next period: <strong>${data.cycle_stats.predicted_next}</strong></p>`;
                if (data.cycle_stats.avg_cycle_length) cycleContent.innerHTML += `<p>Average cycle length: <strong>${data.cycle_stats.avg_cycle_length} days</strong></p>`;

                const remindersList = document.getElementById('reminders-list');
                remindersList.innerHTML = '';
                if (data.reminders && data.reminders.length > 0) {
                    data.reminders.forEach(r => {
                        remindersList.innerHTML += `<li data-reminder-id="${r.id}"><span><strong>${r.text}</strong> on ${r.date}</span><button class="done-btn" title="Mark as Done">✓</button></li>`;
                    });
                } else {
                    remindersList.innerHTML = `<li>${ls.no_reminders_text}</li>`;
                }

                const logsList = document.getElementById('logs-list');
                logsList.innerHTML = '';
                if(data.health_logs && data.health_logs.length > 0) {
                    data.health_logs.forEach(log => { logsList.innerHTML += `<li>${log}</li>`; });
                } else {
                    logsList.innerHTML = `<li>No recent health logs.</li>`;
                }
                
                document.getElementById('meds-widget').style.display = FEATURE_FLAGS.ENABLE_MEDICATION_TRACKING ? 'block' : 'none';
                const medsList = document.getElementById('meds-list');
                medsList.innerHTML = '';
                if(FEATURE_FLAGS.ENABLE_MEDICATION_TRACKING && data.medications && data.medications.length > 0) {
                    data.medications.forEach(med => { medsList.innerHTML += `<li class="meds-item"><div><strong>${med.name}</strong><span class="meds-details">Dosage: ${med.dosage} | Freq: ${med.frequency}</span></div></li>`; });
                } else if (FEATURE_FLAGS.ENABLE_MEDICATION_TRACKING) {
                     medsList.innerHTML = `<li>No medications or supplements logged.</li>`;
                }

                document.getElementById('goals-widget').style.display = FEATURE_FLAGS.ENABLE_GOAL_TRACKING ? 'block' : 'none';
                const goalsList = document.getElementById('goals-list');
                goalsList.innerHTML = '';
                if(FEATURE_FLAGS.ENABLE_GOAL_TRACKING && data.goals && data.goals.length > 0) {
                     data.goals.forEach(goal => { goalsList.innerHTML += `<li class="goals-item"><span>${goal.text}</span></li>`; });
                } else if(FEATURE_FLAGS.ENABLE_GOAL_TRACKING) {
                    goalsList.innerHTML = `<li>No goals set.</li>`;
                }
                
                document.getElementById('customize-dashboard-btn').style.display = FEATURE_FLAGS.ENABLE_DASHBOARD_CUSTOMIZATION ? 'block' : 'none';
                document.getElementById('share-report-btn').style.display = FEATURE_FLAGS.ENABLE_SHAREABLE_REPORTS ? 'inline-block' : 'none';
            }
            
            async function renderChart(canvasId, statusId, endpoint) {
                const canvas = document.getElementById(canvasId);
                const status = document.getElementById(statusId);
                if (!canvas) return;
                try {
                    const config = await handleApiRequest(endpoint);
                    new Chart(canvas.getContext('2d'), config);
                    canvas.style.display = 'block';
                    if (status) status.style.display = 'none';
                } catch (e) {
                    console.error(`Could not load chart for ${canvasId}:`, e);
                    canvas.style.display = 'none';
                    if (status) status.style.display = 'block';
                }
            }
            
            // --- INITIALIZATION ---
            async function initializeDashboard() {
                try {
                    const [config, dashboardData] = await Promise.all([
                        handleApiRequest('/api/v1/config'),
                        handleApiRequest('/api/v1/dashboard/data')
                    ]);
                    
                    LANG_STRINGS = { lang_data: config.lang_data, is_rtl: config.is_rtl };
                    FEATURE_FLAGS = config.feature_flags;
                    
                    document.body.classList.toggle('rtl', LANG_STRINGS.is_rtl);
                    renderStaticText();
                    renderDashboard(dashboardData);
                    setupCustomization();

                } catch (error) {
                    document.body.innerHTML = `<h1>Error</h1><p>Could not load dashboard data. Please log in again.</p><p><a href="widget.html">Back to Chat</a></p>`;
                }
            }
            
            function setupCustomization() {
                 if (!FEATURE_FLAGS.ENABLE_DASHBOARD_CUSTOMIZATION) {
                    renderChart('cycleLengthChart', 'cycleChartStatus', '/chart_data?type=cycle_length');
                    renderChart('interactionTimeChart', 'interactionChartStatus', '/chart_data?type=interaction_time');
                    return;
                }
                const ls = LANG_STRINGS.lang_data;
                const prefsModal = document.getElementById('prefs-modal');
                const customizeBtn = document.getElementById('customize-dashboard-btn');
                const closePrefsBtn = document.getElementById('close-prefs-modal');
                const savePrefsBtn = document.getElementById('save-prefs-btn');
                const prefsList = document.getElementById('prefs-list');
                const WIDGET_PREFS_KEY = 'tyraDashboardWidgetPrefs';

                let widgetConfig = [
                    {id: 'cycle-widget', titleKey: 'widget_title_cycle'},
                    {id: 'reminders-widget', titleKey: 'widget_title_reminders'},
                    {id: 'meds-widget', titleKey: 'widget_title_meds', flag: 'ENABLE_MEDICATION_TRACKING'},
                    {id: 'goals-widget', titleKey: 'widget_title_goals', flag: 'ENABLE_GOAL_TRACKING'},
                    {id: 'cycle-chart-widget', titleKey: 'widget_title_cycle_history'},
                    {id: 'interaction-chart-widget', titleKey: 'widget_title_interaction'},
                    {id: 'logs-widget', titleKey: 'widget_title_health_logs'},
                    {id: 'export-widget', titleKey: 'widget_title_export'},
                ];
                
                prefsList.innerHTML = '';
                widgetConfig.forEach(w => {
                    if (w.flag && !FEATURE_FLAGS[w.flag]) return;
                    prefsList.innerHTML += `<li><label><input type="checkbox" data-widget-id="${w.id}"> ${ls[w.titleKey]}</label></li>`;
                });
                
                const prefsCheckboxes = document.querySelectorAll('.prefs-list input[type="checkbox"]');
                const WIDGET_IDS = Array.from(prefsCheckboxes).map(cb => cb.dataset.widgetId);

                const getPreferences = () => {
                    try {
                        const prefs = localStorage.getItem(WIDGET_PREFS_KEY);
                        if (prefs) return JSON.parse(prefs);
                    } catch (e) { console.error("Could not parse dashboard preferences", e); }
                    let defaultPrefs = {};
                    WIDGET_IDS.forEach(id => defaultPrefs[id] = true);
                    return defaultPrefs;
                };

                const applyPreferences = () => {
                    const prefs = getPreferences();
                    WIDGET_IDS.forEach(id => {
                        const widget = document.getElementById(id);
                        if (widget) widget.classList.toggle('hidden', !prefs[id]);
                    });
                    renderVisibleCharts();
                };

                const savePreferences = () => {
                    let newPrefs = {};
                    prefsCheckboxes.forEach(checkbox => { newPrefs[checkbox.getAttribute('data-widget-id')] = checkbox.checked; });
                    localStorage.setItem(WIDGET_PREFS_KEY, JSON.stringify(newPrefs));
                    applyPreferences();
                    prefsModal.style.display = "none";
                };
                
                const updateModalCheckboxes = () => {
                    const prefs = getPreferences();
                    prefsCheckboxes.forEach(checkbox => { checkbox.checked = prefs[checkbox.getAttribute('data-widget-id')] !== false; });
                };
                
                const renderVisibleCharts = () => {
                    const prefs = getPreferences();
                    if(prefs['cycle-chart-widget']) renderChart('cycleLengthChart', 'cycleChartStatus', '/chart_data?type=cycle_length');
                    if(prefs['interaction-chart-widget']) renderChart('interactionTimeChart', 'interactionChartStatus', '/chart_data?type=interaction_time');
                };

                customizeBtn.onclick = () => { updateModalCheckboxes(); prefsModal.style.display = "block"; };
                closePrefsBtn.onclick = () => { prefsModal.style.display = "none"; };
                savePrefsBtn.onclick = savePreferences;
                
                applyPreferences();
            }

            initializeDashboard();
        });
    </script>
</body>
</html>
